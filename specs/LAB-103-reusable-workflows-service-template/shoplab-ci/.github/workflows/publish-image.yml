name: Reusable OCI Image Publish, SBOM and Cosign Signing

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
        description: 'Nombre completo de la imagen en GHCR (ej: ghcr.io/leandroamariles/chat-service)'
      docker-context:
        type: string
        default: '.'
        description: 'Contexto de construcción Docker'
      dockerfile:
        type: string
        default: 'Dockerfile'
        description: 'Ruta al Dockerfile'
    secrets:
      github-token:
        required: true
        description: 'Token con permisos packages:write'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Refuse to overwrite existing version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          if docker buildx imagetools inspect "${{ inputs.image-name }}:${VERSION_TAG}" >/dev/null 2>&1; then
            echo "::error::El tag de versión ${VERSION_TAG} ya existe en GHCR; las versiones publicadas son inmutables."
            exit 1
          fi

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha,prefix=sha-,format=long,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push OCI image with SBOM and Provenance
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign container image (Keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Firmando criptográficamente ${{ inputs.image-name }}@${DIGEST}..."
          cosign sign --yes "${{ inputs.image-name }}@${DIGEST}"

      - name: Verify Cosign Signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Verificando firma criptográfica de ${{ inputs.image-name }}@${DIGEST}..."
          cosign verify "${{ inputs.image-name }}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Output summary
        run: |
          echo "### Imagen Publicada y Firmada" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagen**: \`${{ inputs.image-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Firma Cosign**: Verificada (Keyless OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "- **SBOM / SLSA Provenance**: Adjunto" >> $GITHUB_STEP_SUMMARY
