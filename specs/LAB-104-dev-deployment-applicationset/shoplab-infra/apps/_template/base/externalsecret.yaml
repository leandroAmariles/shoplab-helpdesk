apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: SERVICE_NAME-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: shoplab-secret-store
  target:
    name: SERVICE_NAME-db-secret
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: shoplab/dev/SERVICE_NAME/database
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: shoplab/dev/SERVICE_NAME/database
        property: password
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: shoplab/dev/SERVICE_NAME/database
        property: url
