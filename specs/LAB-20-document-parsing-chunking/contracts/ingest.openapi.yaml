# Diseño del contrato de POST /ingest (LAB-20). El contrato versionado que verifica la CI es ingest/openapi.json,
# generado por FastAPI al implementar; debe coincidir con este diseño (nombres de campos, códigos y estados).
openapi: 3.1.0
info:
  title: ShopLab Helpdesk Ingest
  version: 0.1.0
  description: Parsea y trocea un documento (PDF o Markdown). No guarda nada.
paths:
  /ingest:
    post:
      operationId: ingestDocument
      summary: Parsea un documento y devuelve sus chunks con metadatos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_ingestDocument"
      responses:
        "200":
          description: Documento troceado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
              example:
                document: {name: returns-01-return-policy.md, title: Política de devoluciones, format: markdown}
                chunks:
                  - text: "## Plazos\nTienes 30 días para devolver un producto."
                    metadata: {document: returns-01-return-policy.md, section: "Política de devoluciones > Plazos", position: 0}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "500": {$ref: "#/components/responses/Error"}
  /health:
    get:
      operationId: health
      summary: Sonda de salud (sin dependencias externas)
      responses:
        "200":
          description: El servicio está listo
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
components:
  responses:
    Error:
      description: Error con código estable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Body_ingestDocument:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: PDF (.pdf) o Markdown UTF-8 (.md); el nombre del archivo es la referencia del documento.
        chunk_size:
          type: integer
          minimum: 100
          description: Sustituye INGEST_CHUNK_SIZE solo en esta petición.
        chunk_overlap:
          type: integer
          minimum: 0
          description: Sustituye INGEST_CHUNK_OVERLAP solo en esta petición; debe ser menor que chunk_size.
    IngestResponse:
      type: object
      required: [document, chunks]
      properties:
        document: {$ref: "#/components/schemas/DocumentInfo"}
        chunks:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/Chunk"}
    DocumentInfo:
      type: object
      required: [name, title, format]
      properties:
        name: {type: string}
        title: {type: string}
        format: {type: string, enum: [markdown, pdf]}
    Chunk:
      type: object
      required: [text, metadata]
      properties:
        text: {type: string, minLength: 1}
        metadata: {$ref: "#/components/schemas/ChunkMetadata"}
    ChunkMetadata:
      type: object
      required: [document, section, position]
      properties:
        document: {type: string, description: Nombre del documento de origen}
        section: {type: string, description: "Ruta de encabezados separada por ' > '; vacía si no hay"}
        position: {type: integer, minimum: 0, description: Posición consecutiva desde 0}
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNSUPPORTED_FORMAT, DOCUMENT_TOO_LARGE, EMPTY_DOCUMENT, NO_EXTRACTABLE_TEXT, INVALID_DOCUMENT,
                 INVALID_CHUNKING_CONFIG, INTERNAL_ERROR]
        message: {type: string}
