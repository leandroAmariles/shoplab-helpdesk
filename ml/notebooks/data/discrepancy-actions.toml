target = "new_task"
action = "Abrir una tarea: 2 productos no tienen peso ni medidas (los mismos en las cuatro columnas). Decidir si se imputan o se excluyen de cualquier cálculo que use el peso."

["unexpected_nulls:catalog.products.length_cm"]
target = "analysis_note"
action = "Son los mismos 2 productos sin peso: se resuelve con la tarea de weight_g y no requiere acción propia."

["unexpected_nulls:catalog.products.height_cm"]
target = "analysis_note"
action = "Son los mismos 2 productos sin peso: se resuelve con la tarea de weight_g y no requiere acción propia."

["unexpected_nulls:catalog.products.width_cm"]
target = "analysis_note"
