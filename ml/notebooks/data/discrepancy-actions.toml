# Acción propuesta para cada discrepancia que detecta el notebook (sección 12).
#
# La búsqueda va de lo específico a lo genérico: primero la clave "tipo:sujeto" y, si no existe, la clave del tipo. Si un
# hallazgo no tiene ninguna, el notebook falla: ninguna discrepancia puede quedar sin acción.
#
# Esto PROPONE, no aplica: crear las tareas en Jira o editar el corpus es trabajo posterior a esta historia.
# `target` ∈ corpus | LAB-41 | loader | new_task | analysis_note

# -- Por tipo: red de seguridad para que un hallazgo nuevo nunca se quede sin acción ----------------------------------

[value_not_in_policies]
target = "corpus"
action = "Decidir si el valor merece documentarse en la política de pagos o de seguimiento; si es ruido, anotarlo aquí."

[policy_value_not_in_data]
target = "corpus"
action = "Revisar la política: declara un valor que los datos no tienen; corregir el documento o aclarar que es teórico."

[status_not_in_order_tool]
target = "LAB-41"
action = "Añadir el estado a la consulta de pedidos de LAB-41 o decidir cómo debe responder el chat cuando lo encuentre."

[tool_state_not_in_data]
target = "LAB-41"
action = "Ajustar la lista de estados de la consulta de pedidos o probarla con datos sintéticos: Olist no tiene ese estado."

[unexpected_nulls]
target = "new_task"
action = "Abrir una tarea para decidir si el cargador debe rellenar, descartar o solo reportar esas filas."

[duplicate_rows]
target = "loader"
action = "Revisar el cargador de LAB-17: debería descartar o consolidar las filas repetidas."

[orphan_reference]
target = "new_task"
action = "Abrir una tarea para decidir si el cargador debe descartar o reportar los ítems que apuntan a ids inexistentes."

[incoherent_dates]
target = "analysis_note"
action = "Excluir estos pedidos de los tiempos de entrega (el notebook ya lo hace) y valorar si el cargador debe reportarlos."

[delivered_without_date]
target = "LAB-41"
action = "Definir qué responde la consulta de pedidos cuando un pedido está entregado pero no tiene fecha de entrega."

[date_with_non_delivered_status]
target = "LAB-41"
action = "Definir qué prevalece en la consulta de pedidos cuando el estado y la fecha de entrega se contradicen."

[implausible_range]
target = "new_task"
action = "Abrir una tarea para decidir si el cargador debe normalizar o descartar los valores fuera de rango."

[category_without_translation]
target = "corpus"
action = "Mostrar el nombre original de la categoría en el chat y valorar añadir la traducción que falta."

# -- Específicas: curadas a mano sobre la ejecución con el dataset completo (99 441 pedidos) ---------------------------

["unexpected_nulls:catalog.products.category_name"]
target = "new_task"
action = "Abrir una tarea: 610 productos no tienen categoría, nombre, descripción ni fotos (son los mismos). Decidir si el catálogo los oculta o las respuestas los muestran como «sin categoría»."

["unexpected_nulls:catalog.products.name_length"]
target = "analysis_note"
action = "Son los mismos 610 productos sin categoría: se resuelve con la tarea de category_name y no requiere acción propia."

["unexpected_nulls:catalog.products.description_length"]
target = "analysis_note"
action = "Son los mismos 610 productos sin categoría: se resuelve con la tarea de category_name y no requiere acción propia."

