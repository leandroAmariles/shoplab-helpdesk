["unexpected_nulls:orders.orders.approved_at"]
target = "LAB-41"
action = "14 pedidos `delivered` no tienen fecha de aprobación: la consulta de pedidos no debe depender de `approved_at` para mostrar el estado."

["unexpected_nulls:orders.orders.delivered_to_carrier_at"]
target = "LAB-41"
action = "2 pedidos `delivered` no tienen fecha de entrega al transportista: la consulta de pedidos no debe exigirla para mostrar un pedido entregado."

["implausible_range:catalog.products.weight_g"]
target = "new_task"
action = "4 productos pesan 0 g: tratarlos como dato faltante en cualquier cálculo que use el peso (envío, modelado de F8)."

["implausible_range:orders.order_items.shipping_limit_at"]
target = "loader"
action = "4 ítems tienen fecha límite de envío en 2020, fuera de la ventana 2016-2018 del dataset: valorar que el cargador de LAB-17 los reporte. No afectan a los tiempos de entrega."

["category_without_translation:catalog.product_categories.name_en"]
target = "loader"
action = "2 categorías sin traducción (pc_gamer y portateis_cozinha_e_preparadores_de_alimentos): el chat debe mostrar el nombre original; valorar añadir la traducción en el cargador."

["value_not_in_policies:payment_type:not_defined"]
target = "corpus"
action = "Es ruido: solo 3 pagos de importe cero, todos en pedidos `canceled`. Añadir a payments-01 una línea que explique `not_defined` o dejar constancia de que se ignora; el chat no debe presentarlo como método de pago."

["delivered_without_date:orders.orders.delivered_to_customer_at"]
target = "LAB-41"
action = "8 pedidos `delivered` no tienen fecha de entrega (7 sí tienen fecha de transportista): la consulta de pedidos debe responder «entregado, fecha no disponible» en lugar de fallar."

["date_with_non_delivered_status:orders.orders.delivered_to_customer_at"]
target = "LAB-41"
action = "6 pedidos `canceled` tienen fecha de entrega: el estado manda; la consulta de pedidos debe informar `canceled` y no la fecha."
