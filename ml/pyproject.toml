[project]
name = "shoplab-ml"
version = "0.1.0"
description = "Exploratory analysis and classic ML on the Olist data of ShopLab Helpdesk (F8)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "matplotlib>=3.9",
    "ipykernel>=6.29",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_eda", "src/intent_dataset", "src/intent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=olist_eda --cov=intent_dataset --cov=intent --cov-fail-under=80"

[tool.ruff]
line-length = 121
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
