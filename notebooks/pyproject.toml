[project]
name = "chunking-lab"
version = "0.1.0"
description = "Notebook and helpers that compare chunking strategies on the ShopLab knowledge base"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "markdown-it-py>=3.0",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chunking_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=chunking_lab --cov-fail-under=80"

[tool.ruff]
line-length = 121
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
