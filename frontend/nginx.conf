server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new release is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (e.g. /chat) resolve to the app, not to an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
