@if (sources().length > 0) {
  <section class="sources" [attr.aria-label]="label()">
    <h3 class="title">{{ label() }}</h3>
    <ul>
      @for (source of sources(); track source.number) {
        <li>
          <button type="button" class="source" [attr.aria-label]="'Fuente ' + source.number + ': ' + source.title"
                  (click)="open.emit(source)">
            <span class="name">{{ source.number }}. {{ source.title }}@if (source.section) { › {{ source.section }}}</span>
          </button>
        </li>
      }
    </ul>
  </section>
}
