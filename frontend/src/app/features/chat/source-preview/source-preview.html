<h2 mat-dialog-title>{{ source.title }}</h2>

<mat-dialog-content>
  @if (source.section) {
    <p class="section">{{ source.section }}</p>
  }
  <div class="markdown" [innerHTML]="html()"></div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
