[project]
name = "ingest"
version = "0.1.0"
description = "Stateless document parsing and chunking service of ShopLab Helpdesk (PDF and Markdown)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
    "pdfplumber>=0.11",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "fpdf2>=2.8",
    "pypdf>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-fail-under=80"

[tool.coverage.run]
omit = ["app/openapi_export.py"]

[tool.ruff]
line-length = 121
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
