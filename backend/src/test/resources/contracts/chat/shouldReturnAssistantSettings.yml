name: should_return_assistant_settings
description: Returns active retrieval configuration and served prompt versions including nullable DEFAULT version
request:
  method: GET
  urlPath: /api/assistant/settings
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    topK: 5
    similarityThreshold: 0.45
    maxContextCharacters: 6000
    prompts:
      - name: chat-system
        version: 3
        source: LANGFUSE
      - name: chat-small-talk
        version: null
        source: DEFAULT
  matchers:
    body:
      - path: $.topK
        type: by_regex
        value: "[1-9][0-9]*"
      - path: $.similarityThreshold
        type: by_regex
        value: "[0-9]+(\\.[0-9]+)?"
      - path: $.maxContextCharacters
        type: by_regex
        value: "[1-9][0-9]*"
      - path: $.prompts
        type: by_type
        minOccurrence: 2
