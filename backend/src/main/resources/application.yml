spring:
  application:
    name: helpdesk-backend
  reactor:
    context-propagation: auto
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/shoplab}
    username: ${POSTGRES_USER:shoplab}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  flyway:
    enabled: false

server:
  port: 8080

shoplab:
  # Assistant settings client for eval -> chat-service (LAB-59).
  chat:
    settings:
      client:
        base-url: ${SHOPLAB_CHAT_SETTINGS_CLIENT_BASE_URL:http://localhost:8083}
        timeout: ${SHOPLAB_CHAT_SETTINGS_CLIENT_TIMEOUT:5s}
  # History of the evaluation runs (LAB-31). The tool of eval/ saves each run with POST /api/eval/runs and the header
  # X-Eval-Token. Empty token = saving is off (403): the backend has no authentication yet, so a write is never open.
  eval:
    persistence:
      token: ${SHOPLAB_EVAL_PERSISTENCE_TOKEN:}
    # Reading of the history by the admin-eval screen (LAB-32). It needs no token and writes nothing. The screen links
    # each result to its trace in Langfuse with this address ({traceId} is replaced by the id of the trace); empty =
    # no link, the screen shows the id to copy. The default is the Langfuse of the llmops profile of the local compose.
    history:
      trace-url-template: ${SHOPLAB_EVAL_HISTORY_TRACE_URL_TEMPLATE:http://localhost:3001/trace/{traceId}}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
