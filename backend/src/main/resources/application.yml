spring:
  application:
    name: helpdesk-backend
  reactor:
    context-propagation: auto
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/shoplab}
    username: ${POSTGRES_USER:shoplab}
    password: ${POSTGRES_PASSWORD:change-me-local-only}
  flyway:
    enabled: false
  webflux:
    multipart:
      max-in-memory-size: ${SHOPLAB_RETRIEVAL_UPLOAD_MAX_PART_SIZE:11MB}
      max-disk-usage-per-part: ${SHOPLAB_RETRIEVAL_UPLOAD_MAX_PART_SIZE:11MB}
      max-parts: 4
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
          keep-alive: ${OLLAMA_KEEP_ALIVE:30m}
          num-ctx: ${OLLAMA_NUM_CTX:8192}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:bge-m3}

server:
  port: 8080

shoplab:
  chat:
    max-message-length: 4000
    # Empty keeps the grounded default prompt (answer only with the retrieved context).
    system-prompt: ${SHOPLAB_CHAT_SYSTEM_PROMPT:}
    rag:
      top-k: ${SHOPLAB_CHAT_RAG_TOP_K:4}
      similarity-threshold: ${SHOPLAB_CHAT_RAG_SIMILARITY_THRESHOLD:0.6}
      max-context-characters: ${SHOPLAB_CHAT_RAG_MAX_CONTEXT_CHARACTERS:8000}
      # fixed-message answers a configured text without calling the model; model lets the model answer by itself.
      no-context-mode: ${SHOPLAB_CHAT_RAG_NO_CONTEXT_MODE:fixed-message}
    memory:
      # Most recent turns (question + answer) handed to the model; 0 turns the memory off.
      max-turns: ${SHOPLAB_CHAT_MEMORY_MAX_TURNS:5}
      max-history-characters: ${SHOPLAB_CHAT_MEMORY_MAX_HISTORY_CHARACTERS:4000}
      # Previous questions added to the search of context so a follow-up finds the topic; 0 uses the message alone.
      retrieval-turns: ${SHOPLAB_CHAT_MEMORY_RETRIEVAL_TURNS:1}
    # One Langfuse trace per chat turn (LAB-64). Off by default: nothing is created and nothing is sent. The traces
    # carry the whole conversation (question, prompt, context, answer): use them with public or test data only.
    tracing:
      enabled: ${SHOPLAB_CHAT_TRACING_ENABLED:false}
      endpoint: ${SHOPLAB_CHAT_TRACING_ENDPOINT:http://localhost:3001/api/public/otel}
      public-key: ${SHOPLAB_CHAT_TRACING_PUBLIC_KEY:}
      secret-key: ${SHOPLAB_CHAT_TRACING_SECRET_KEY:}
      environment: ${SHOPLAB_CHAT_TRACING_ENVIRONMENT:local}
      max-content-characters: ${SHOPLAB_CHAT_TRACING_MAX_CONTENT_CHARACTERS:20000}
      queue-size: ${SHOPLAB_CHAT_TRACING_QUEUE_SIZE:2048}
      batch-size: ${SHOPLAB_CHAT_TRACING_BATCH_SIZE:256}
      schedule-delay: ${SHOPLAB_CHAT_TRACING_SCHEDULE_DELAY:2s}
      export-timeout: ${SHOPLAB_CHAT_TRACING_EXPORT_TIMEOUT:5s}
      shutdown-timeout: ${SHOPLAB_CHAT_TRACING_SHUTDOWN_TIMEOUT:5s}
      # USD per million tokens, by model name or by provider; a local model costs 0. A model without a price has
      # no cost in its trace (it is not guessed).
      pricing:
        ollama:
          input-per-million: 0
          output-per-million: 0
  retrieval:
    ingest:
      base-url: ${SHOPLAB_RETRIEVAL_INGEST_BASE_URL:http://localhost:8000}
      timeout: ${SHOPLAB_RETRIEVAL_INGEST_TIMEOUT:30s}
      max-response-bytes: ${SHOPLAB_RETRIEVAL_INGEST_MAX_RESPONSE_BYTES:33554432}
    upload:
      # Largest document accepted by POST /api/documents; the same 10 MiB as the ingest service.
      max-bytes: ${SHOPLAB_RETRIEVAL_UPLOAD_MAX_BYTES:10485760}
    embedding:
      batch-size: ${SHOPLAB_RETRIEVAL_EMBEDDING_BATCH_SIZE:16}
      search-limit: ${SHOPLAB_RETRIEVAL_EMBEDDING_SEARCH_LIMIT:5}
      auto-index: ${SHOPLAB_RETRIEVAL_EMBEDDING_AUTO_INDEX:true}
      reindex-on-startup: ${SHOPLAB_RETRIEVAL_EMBEDDING_REINDEX_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
