version: "1.0"

linter: qodana-jvm-community

# shoplab-contracts and the stubs of retrieval-service come from GitHub Packages (LAB-129).
bootstrap: mkdir -p "$HOME/.m2" && cp .mvn/ci-settings.xml "$HOME/.m2/settings.xml"

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      - target
      - src/main/generated

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
