# Configuracion del gateway de modelos (LAB-84). Es una PLANTILLA: entrypoint.sh la renderiza con render_config.py
# (expande ${VAR:-defecto}; las referencias os.environ/NOMBRE las resuelve LiteLLM y nunca quedan en el archivo).
#
# El backend solo pide los nombres logicos `chat` y `embeddings`. Cambiar el modelo real se hace aqui o con las
# variables LITELLM_*, y se aplica recreando/reiniciando solo el gateway (FR-006, FR-007).
# Los precios son de REFERENCIA (no representan dinero real): permiten medir y presupuestar tambien modelos locales
# (FR-022). Editables con las variables LITELLM_*_INPUT_COST / LITELLM_*_OUTPUT_COST.

model_list:
  # Chat: principal. Ruta por defecto a Ollama local, sin claves de nube (FR-010).
  - model_name: chat
    litellm_params:
      model: ollama_chat/${LITELLM_CHAT_PRIMARY_MODEL:-${OLLAMA_CHAT_MODEL:-llama3.2:3b}}
      api_base: ${OLLAMA_API_BASE:-http://ollama:11434}
      num_ctx: ${LITELLM_NUM_CTX:-8192}
      keep_alive: ${LITELLM_KEEP_ALIVE:-30m}
    model_info:
      id: chat-primary
      input_cost_per_token: ${LITELLM_CHAT_PRIMARY_INPUT_COST:-0.00000015}
      output_cost_per_token: ${LITELLM_CHAT_PRIMARY_OUTPUT_COST:-0.0000006}
  # Juez de la evaluacion de calidad de respuesta (LAB-29). Nombre logico propio: cambiar el modelo que juzga no toca al chat.
  # Por defecto qwen2.5:7b: la verificacion S-1 mostro que llama3.2:3b (el chat) NO rellena las salidas estructuradas del
  # juez (devuelve el esquema JSON en vez de los valores en casi todas las llamadas) y qwen2.5:7b si, con las tres metricas
  # discriminando (specs/LAB-29-answer-quality-metrics/validation.md). LITELLM_JUDGE_MODEL lo cambia y OLLAMA_JUDGE_MODEL
  # es el que descarga Ollama. SIN fallback: caer a otro modelo cambiaria las puntuaciones sin avisar. Solo lo puede
  # llamar la clave virtual `eval` (keys.yaml).
  - model_name: judge
    litellm_params:
      model: ollama_chat/${LITELLM_JUDGE_MODEL:-${OLLAMA_JUDGE_MODEL:-qwen2.5:7b}}
      api_base: ${OLLAMA_API_BASE:-http://ollama:11434}
      num_ctx: ${LITELLM_NUM_CTX:-8192}
      keep_alive: ${LITELLM_KEEP_ALIVE:-30m}
    model_info:
      id: judge-primary
      input_cost_per_token: ${LITELLM_CHAT_PRIMARY_INPUT_COST:-0.00000015}
      output_cost_per_token: ${LITELLM_CHAT_PRIMARY_OUTPUT_COST:-0.0000006}
  # Chat: respaldo local (mas pequeno). No es un nombre que pida el backend: solo es destino del fallback (FR-013).
  - model_name: chat-fallback
    litellm_params:
      model: ollama_chat/${LITELLM_CHAT_FALLBACK_MODEL:-llama3.2:1b}
      api_base: ${OLLAMA_API_BASE:-http://ollama:11434}
      num_ctx: ${LITELLM_NUM_CTX:-8192}
      keep_alive: ${LITELLM_KEEP_ALIVE:-30m}
    model_info:
      id: chat-fallback
      input_cost_per_token: ${LITELLM_CHAT_FALLBACK_INPUT_COST:-0.00000005}
      output_cost_per_token: ${LITELLM_CHAT_FALLBACK_OUTPUT_COST:-0.0000002}
  # Embeddings: SIN fallback. Un respaldo con otra dimension corromperia el indice (FR-009, ADR-0003).
  - model_name: embeddings
    litellm_params:
      model: ollama/${LITELLM_EMBED_MODEL:-${OLLAMA_EMBED_MODEL:-bge-m3}}
      api_base: ${OLLAMA_API_BASE:-http://ollama:11434}
    model_info:
      id: embeddings-primary
      input_cost_per_token: ${LITELLM_EMBED_INPUT_COST:-0.0000001}
      output_cost_per_token: 0
#@cloud-begin
  # Proveedor cloud OPCIONAL: este bloque solo existe si CLOUD_PROVIDER_API_KEY no esta vacio (FR-011). Nunca es
  # principal ni respaldo salvo configuracion explicita (FR-012).
  - model_name: chat-cloud
    litellm_params:
      model: ${CLOUD_PROVIDER_MODEL}
      api_key: os.environ/CLOUD_PROVIDER_API_KEY
      api_base: ${CLOUD_PROVIDER_API_BASE:-}
    model_info:
      id: chat-cloud
      input_cost_per_token: ${LITELLM_CLOUD_INPUT_COST:-0.00000015}
      output_cost_per_token: ${LITELLM_CLOUD_OUTPUT_COST:-0.0000006}
#@cloud-end

router_settings:
  # Solo `chat` cae al respaldo. Ni `embeddings` (FR-009) ni `chat-cloud` (FR-012) llevan fallback.
  fallbacks: [{ chat: [chat-fallback] }]
  num_retries: 1
  timeout: 60
  stream_timeout: 30
  allowed_fails: 1
  # El despliegue caido sale de rotacion este tiempo y vuelve solo (FR-016).
  cooldown_time: 30

litellm_settings:
  # Una linea JSON por peticion, sin contenido (contracts/log-schema.md).
  callbacks: shoplab_callbacks.shoplab_logger
  # Ningun callback recibe el texto de preguntas ni respuestas (FR-026).
  turn_off_message_logging: true
  # Un fallo a mitad de la respuesta no se reinicia con otro modelo (edge case de la spec).
  enable_mid_stream_fallback_continuation: false
  # Ollama no acepta algunos parametros estandar de OpenAI (p. ej. `user` en embeddings): el gateway los descarta en
  # lugar de rechazar la peticion. `user` sigue llegando al callback de log (verificado contra el gateway real).
  drop_params: true
  json_logs: true
  request_correlation_in_logs: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: false
  # El presupuesto de cada clave se reinicia solo al acabar su periodo (FR-020).
  disable_reset_budget: false
