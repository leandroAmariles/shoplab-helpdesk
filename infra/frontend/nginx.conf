# nginx of the frontend container in docker compose (LAB-107). It is the configuration of shoplab-frontend plus the
# forwarding of /api to the gateway, which in the cluster is done by the ingress.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS, asked again every few seconds: recreating the gateway (to move a route) changes its address.
    resolver 127.0.0.11 valid=5s;

    # ^~ so that no regular expression location below can take an API path.
    location ^~ /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # The chat answers as a stream: nothing may be held back.
        proxy_buffering off;
        proxy_read_timeout 120s;
        # Documents of up to 10 MiB plus the multipart headers, as in the cluster ingress.
        client_max_body_size 12m;
    }

    # Hashed build assets never change: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new release is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (e.g. /chat) resolve to the app, not to an nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
