# Infraestructura local de ShopLab Helpdesk.
#
# Uso: docker compose -f infra/docker-compose.yml up -d --wait
#
# Perfiles:
#   core           postgres + ollama + litellm (gateway de modelos, LAB-84) + su postgres + ingest. Siempre activo
#                  (sin clave `profiles:`); `--profile core` es no-op. Toda llamada a un modelo pasa por `litellm`
#                  (puerto 4000, API compatible con OpenAI): `ollama` ya no publica puerto y solo comparte la red
#                  `models` con el gateway. Para publicarlo (Ollama del host que usa el cluster DEV, mediciones):
#                  anadir `-f infra/docker-compose.ollama-host.yml`.
#   llmops         langfuse (LAB-64): web, worker y sus almacenes (postgres, clickhouse, redis, minio) con prefijo
#                  `langfuse-`. Interfaz en http://localhost:3001. Activar: --profile llmops.
#   observability  prometheus + grafana (LAB-102): Prometheus recoge del host los servicios (8082-8084) y el gateway
#                  (8080); Grafana arranca con el origen de datos y los dashboards de infra/observability/.
#                  Activar: --profile observability.
#   kafka          reservado, sin servicios todavia (F4).
# Activar un perfil reservado no produce error: `--profile <nombre>`.
# GPU NVIDIA opcional: anadir `-f infra/docker-compose.gpu.yml`.

name: shoplab

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoplab}
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
          psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc
          "select 1 from pg_extension where extname='vector'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.17}
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      # Modelo de respaldo del gateway: solo se descarga si se define (FR-013). Vacio = no se descarga nada.
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-}
      # Modelo del juez de la evaluacion (LAB-29, qwen2.5:7b): como el de respaldo, solo se descarga si se define.
      OLLAMA_JUDGE_MODEL: ${OLLAMA_JUDGE_MODEL:-}
    # Sin `ports`: solo `litellm` llega a Ollama (FR-002). La red `models` es la unica que comparte con el gateway.
    networks:
      - models
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list | grep -qF "$${OLLAMA_CHAT_MODEL}" &&
          ollama list | grep -qF "$${OLLAMA_EMBED_MODEL}" &&
          { [ -z "$${OLLAMA_FALLBACK_MODEL}" ] || ollama list | grep -qF "$${OLLAMA_FALLBACK_MODEL}"; } &&
          { [ -z "$${OLLAMA_JUDGE_MODEL}" ] || ollama list | grep -qF "$${OLLAMA_JUDGE_MODEL}"; }
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  # Gateway de modelos (LAB-84): unico punto de salida hacia Ollama y hacia cualquier proveedor cloud. Estado propio
  # (claves virtuales y gasto) en su postgres, sin mezclar tablas con la aplicacion (ADR-0002).
  litellm-postgres:
    image: ${LITELLM_POSTGRES_IMAGE:-docker.io/postgres:17.7}
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:1.110.2}
    entrypoint: ["sh", "/app/shoplab/entrypoint.sh"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_POSTGRES_PASSWORD:-change-me-local-only}@litellm-postgres:5432/litellm
      # Marcadores SOLO para uso local; LiteLLM exige el formato `sk-...`.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-shoplab-master-local-only}
      DISABLE_ADMIN_UI: "true"
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-local}
      # Una cadena vacia cuenta como no definida: render_config.py usa entonces el valor por defecto de config.yaml.
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}
      LITELLM_CHAT_PRIMARY_MODEL: ${LITELLM_CHAT_PRIMARY_MODEL:-}
      LITELLM_CHAT_FALLBACK_MODEL: ${LITELLM_CHAT_FALLBACK_MODEL:-}
      # Juez de la evaluacion de calidad (LAB-29): vacio = OLLAMA_JUDGE_MODEL o qwen2.5:7b.
      LITELLM_JUDGE_MODEL: ${LITELLM_JUDGE_MODEL:-}
      LITELLM_EMBED_MODEL: ${LITELLM_EMBED_MODEL:-}
      LITELLM_CHAT_PRIMARY_INPUT_COST: ${LITELLM_CHAT_PRIMARY_INPUT_COST:-}
      LITELLM_CHAT_PRIMARY_OUTPUT_COST: ${LITELLM_CHAT_PRIMARY_OUTPUT_COST:-}
      LITELLM_CHAT_FALLBACK_INPUT_COST: ${LITELLM_CHAT_FALLBACK_INPUT_COST:-}
      LITELLM_CHAT_FALLBACK_OUTPUT_COST: ${LITELLM_CHAT_FALLBACK_OUTPUT_COST:-}
      LITELLM_EMBED_INPUT_COST: ${LITELLM_EMBED_INPUT_COST:-}
      # Proveedor cloud opcional (FR-011): sin CLOUD_PROVIDER_API_KEY el modelo `chat-cloud` no existe.
      CLOUD_PROVIDER_API_KEY: ${CLOUD_PROVIDER_API_KEY:-}
      CLOUD_PROVIDER_MODEL: ${CLOUD_PROVIDER_MODEL:-}
      CLOUD_PROVIDER_API_BASE: ${CLOUD_PROVIDER_API_BASE:-}
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    networks:
      - default
      - models
    volumes:
      - ./litellm:/app/shoplab:ro
    depends_on:
      litellm-postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # Crea o actualiza las claves virtuales de keys.yaml y termina (servicio de un solo disparo, idempotente).
  litellm-bootstrap:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:1.110.2}
    entrypoint: ["python", "/app/shoplab/bootstrap_keys.py", "/app/shoplab/keys.yaml"]
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-shoplab-master-local-only}
      GATEWAY_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-local}
      LITELLM_KEY_CHAT: ${LITELLM_KEY_CHAT:-sk-shoplab-chat-local}
      LITELLM_KEY_INGEST: ${LITELLM_KEY_INGEST:-sk-shoplab-ingest-local}
      LITELLM_KEY_EVAL: ${LITELLM_KEY_EVAL:-sk-shoplab-eval-local}
      LITELLM_KEY_RETRIEVAL: ${LITELLM_KEY_RETRIEVAL:-sk-shoplab-retrieval-local}
      CLOUD_PROVIDER_API_KEY: ${CLOUD_PROVIDER_API_KEY:-}
    volumes:
      - ./litellm:/app/shoplab:ro
    depends_on:
      litellm:
        condition: service_healthy
    restart: "no"

  # Parseo y troceado de documentos (LAB-20). Sin estado y sin acceso a la base de datos: entrega los chunks al modulo
  # retrieval-service, que es quien los guarda.
  ingest:
    image: ${INGEST_IMAGE:-ghcr.io/leandroamariles/ingest:v0.26.0}
    environment:
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE:-1000}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP:-100}
      INGEST_MAX_DOCUMENT_BYTES: ${INGEST_MAX_DOCUMENT_BYTES:-10485760}
    ports:
      - "${INGEST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Rol, base y extension de retrieval-service en el mismo PostgreSQL (LAB-129). Idempotente y de un solo disparo:
  # los scripts de postgres/init no corren sobre un volumen que ya existe.
  retrieval-db-init:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shoplab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      APP_DB: ${POSTGRES_DB:-shoplab}
      RETRIEVAL_DB_PASSWORD: ${RETRIEVAL_DB_PASSWORD:-change-me-local-only}
    entrypoint: ["bash", "/retrieval-db-init.sh"]
    volumes:
      - ./postgres/retrieval-db-init.sh:/retrieval-db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Base de conocimiento en su propio servicio (LAB-129): el gateway le envia /api/documents y /api/knowledge, y el
  # chat-service la consulta aqui. El 8082 del host es solo para depurar.
  retrieval-service:
    image: ${RETRIEVAL_IMAGE:-ghcr.io/leandroamariles/retrieval-service:v0.2.0}
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/retrieval
      POSTGRES_USER: retrieval
      POSTGRES_PASSWORD: ${RETRIEVAL_DB_PASSWORD:-change-me-local-only}
      SPRING_AI_OPENAI_BASE_URL: http://litellm:4000/v1
      SPRING_AI_OPENAI_API_KEY: ${LITELLM_KEY_RETRIEVAL:-sk-shoplab-retrieval-local}
      SHOPLAB_RETRIEVAL_INGEST_BASE_URL: http://ingest:8000
      # Debe ser el modelo de los vectores guardados, o la busqueda responde vacio.
      SHOPLAB_RETRIEVAL_EMBEDDING_MODEL_NAME: ${OLLAMA_EMBED_MODEL:-bge-m3}
    ports:
      - "${RETRIEVAL_PORT:-8082}:8080"
    depends_on:
      retrieval-db-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      ingest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Rol y base de chat-service en el mismo PostgreSQL (LAB-59). Idempotente y de un solo disparo.
  chat-db-init:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shoplab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      APP_DB: ${POSTGRES_DB:-shoplab}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-change-me-local-only}
    entrypoint: ["bash", "/chat-db-init.sh"]
    volumes:
      - ./postgres/chat-db-init.sh:/chat-db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Rol y base de eval-service en el mismo PostgreSQL (LAB-130). Idempotente y de un solo disparo.
  eval-db-init:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shoplab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      APP_DB: ${POSTGRES_DB:-shoplab}
      EVAL_DB_PASSWORD: ${EVAL_DB_PASSWORD:-change-me-local-only}
    entrypoint: ["bash", "/eval-db-init.sh"]
    volumes:
      - ./postgres/eval-db-init.sh:/eval-db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Orquestador conversacional en su propio servicio (LAB-59): SSE chat, citas RAG, memoria, feedback, prompts y trazas.
  # El 8083 del host es solo para depurar.
  chat-service:
    image: ${CHAT_IMAGE:-ghcr.io/leandroamariles/chat-service:v0.1.0}
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-change-me-local-only}
      SPRING_AI_OPENAI_BASE_URL: http://litellm:4000/v1
      SPRING_AI_OPENAI_API_KEY: ${LITELLM_KEY_CHAT:-sk-shoplab-chat-local}
      SHOPLAB_RETRIEVAL_CLIENT_BASE_URL: http://retrieval-service:8080
      SHOPLAB_CHAT_PROMPTS_ENABLED: ${SHOPLAB_CHAT_PROMPTS_ENABLED:-false}
      SHOPLAB_CHAT_PROMPTS_BASE_URL: ${SHOPLAB_CHAT_PROMPTS_BASE_URL:-http://langfuse-web:3000}
      SHOPLAB_CHAT_PROMPTS_OVERRIDE_TOKEN: ${SHOPLAB_CHAT_PROMPTS_OVERRIDE_TOKEN:-}
      SHOPLAB_CHAT_TRACING_ENABLED: ${SHOPLAB_CHAT_TRACING_ENABLED:-false}
      SHOPLAB_CHAT_TRACING_ENDPOINT: ${SHOPLAB_CHAT_TRACING_ENDPOINT:-http://langfuse-web:3000/api/public/otel}
      SHOPLAB_CHAT_TRACING_PUBLIC_KEY: ${LANGFUSE_INIT_PUBLIC_KEY:-pk-lf-shoplab-local}
      SHOPLAB_CHAT_TRACING_SECRET_KEY: ${LANGFUSE_INIT_SECRET_KEY:-sk-lf-shoplab-local}
    ports:
      - "${CHAT_PORT:-8083}:8080"
    depends_on:
      chat-db-init:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      retrieval-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Historial de ejecuciones de evaluacion y admin-eval en su propio servicio (LAB-130). El 8084 del host es para depurar.
  eval-service:
    image: ${EVAL_IMAGE:-ghcr.io/leandroamariles/eval-service:v0.1.0}
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/eval
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: ${EVAL_DB_PASSWORD:-change-me-local-only}
      SHOPLAB_CHAT_SETTINGS_CLIENT_BASE_URL: http://chat-service:8080
      SHOPLAB_EVAL_PERSISTENCE_TOKEN: ${SHOPLAB_EVAL_PERSISTENCE_TOKEN:-}
      SHOPLAB_EVAL_HISTORY_TRACE_URL_TEMPLATE: ${SHOPLAB_EVAL_HISTORY_TRACE_URL_TEMPLATE:-http://localhost:3001/trace/{traceId}}
    ports:
      - "${EVAL_PORT:-8084}:8080"
    depends_on:
      eval-db-init:
        condition: service_completed_successfully
      chat-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Rol y base de catalog-service en el mismo PostgreSQL (LAB-113). Idempotente y de un solo disparo.
  catalog-db-init:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-shoplab}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      APP_DB: ${POSTGRES_DB:-shoplab}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-change-me-local-only}
    entrypoint: ["bash", "/catalog-db-init.sh"]
    volumes:
      - ./postgres/catalog-db-init.sh:/catalog-db-init.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Catalogo e inventario (LAB-113): API en /api/catalog por el gateway y servidor MCP en /mcp. El 8085 del host es para
  # depurar. Los datos se copian una vez con scripts/migrate-catalog.sh.
  catalog-service:
    image: ${CATALOG_IMAGE:-ghcr.io/leandroamariles/catalog-service:v0.1.0}
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-change-me-local-only}
    ports:
      - "${CATALOG_PORT:-8085}:8080"
    depends_on:
      catalog-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Puerta unica de la API (LAB-107, repo shoplab-gateway): reparte /api por prefijo; documents y knowledge van a
  # retrieval-service (LAB-129), chat y assistant a chat-service (LAB-59) y eval a eval-service (LAB-130).
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/leandroamariles/gateway:v0.1.0}
    environment:
      SHOPLAB_GATEWAY_ROUTES_CHAT_URI: ${SHOPLAB_GATEWAY_ROUTES_CHAT_URI:-http://chat-service:8080}
      SHOPLAB_GATEWAY_ROUTES_DOCUMENTS_URI: ${SHOPLAB_GATEWAY_ROUTES_DOCUMENTS_URI:-http://retrieval-service:8080}
      SHOPLAB_GATEWAY_ROUTES_KNOWLEDGE_URI: ${SHOPLAB_GATEWAY_ROUTES_KNOWLEDGE_URI:-http://retrieval-service:8080}
      SHOPLAB_GATEWAY_ROUTES_EVAL_URI: ${SHOPLAB_GATEWAY_ROUTES_EVAL_URI:-http://eval-service:8080}
      SHOPLAB_GATEWAY_ROUTES_ASSISTANT_URI: ${SHOPLAB_GATEWAY_ROUTES_ASSISTANT_URI:-http://chat-service:8080}
      SHOPLAB_GATEWAY_ROUTES_CATALOG_PREFIX: /api/catalog
      SHOPLAB_GATEWAY_ROUTES_CATALOG_URI: ${SHOPLAB_GATEWAY_ROUTES_CATALOG_URI:-http://catalog-service:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      catalog-service:
        condition: service_healthy
      eval-service:
        condition: service_healthy
      retrieval-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Frontend Angular SPA (LAB-110). Interfaz de usuario servida en el puerto 4200. Su nginx reenvia /api al gateway
  # (infra/frontend/nginx.conf), como en el cluster hace el ingress.
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/leandroamariles/frontend:v0.26.0}
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.16.0}
    profiles: [observability]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Los servicios se recogen por el host: host.docker.internal tambien debe resolver en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.1}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- Perfil llmops (LAB-64): Langfuse v4 autoalojado --------------------------------------------------------------
  # Interfaz en http://localhost:${LANGFUSE_PORT:-3001} (3000 es de Grafana). Los almacenes no publican puertos al host
  # (solo MinIO, en loopback, para la carga de medios desde el navegador). Credenciales: marcadores SOLO para uso local.
  langfuse-postgres:
    image: ${LANGFUSE_POSTGRES_IMAGE:-docker.io/postgres:17.7}
    profiles: [llmops]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:26.10.4.207}
    profiles: [llmops]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-change-me-local-only}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  langfuse-redis:
    image: ${LANGFUSE_REDIS_IMAGE:-docker.io/redis:8.10.3}
    profiles: [llmops]
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-change-me-local-only}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_AUTH:-change-me-local-only}
    restart: unless-stopped

  langfuse-minio:
    image: ${LANGFUSE_MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:304e0bbeb70a9aa0c40ff26d5a9c0a24296019c6d326ba8b75214fb73441d6e9}
    profiles: [llmops]
    # El bucket `langfuse` es el directorio /data/langfuse: se crea antes de arrancar el servidor.
    entrypoint: sh
    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9092}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE:-docker.langfuse.com/langfuse/langfuse-worker:4.77.0}
    profiles: [llmops]
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-change-me-local-only}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-change-me-local-only}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-change-me-local-only}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-change-me-local-only}
      REDIS_TLS_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-change-me-local-only}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-change-me-local-only}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on: &langfuse-depends
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      # Langfuse escucha en la direccion del contenedor, no en 127.0.0.1.
      test: ["CMD-SHELL", "wget -q --spider http://$${HOSTNAME}:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  langfuse-web:
    image: ${LANGFUSE_WEB_IMAGE:-docker.langfuse.com/langfuse/langfuse:4.77.0}
    profiles: [llmops]
    depends_on: *langfuse-depends
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-local-only}
      # El navegador sube los medios a MinIO por el puerto publicado en el host.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_PORT:-9092}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Organizacion, proyecto, usuario y claves creados al arrancar (sin alta manual en la interfaz).
      LANGFUSE_INIT_ORG_ID: shoplab
      LANGFUSE_INIT_ORG_NAME: ShopLab
      LANGFUSE_INIT_PROJECT_ID: shoplab-helpdesk
      LANGFUSE_INIT_PROJECT_NAME: shoplab-helpdesk
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PUBLIC_KEY:-pk-lf-shoplab-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_SECRET_KEY:-sk-lf-shoplab-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@shoplab.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$${HOSTNAME}:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
  litellm_postgres_data:
  prometheus_data:
  grafana_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:

# `models` aisla a Ollama: solo `ollama` y `litellm` estan en ella; `ingest`, `postgres` y el resto solo en `default`.
networks:
  default: {}
  models: {}
