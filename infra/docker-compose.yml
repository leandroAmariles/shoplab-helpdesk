# Infraestructura local de ShopLab Helpdesk.
#
# Uso: docker compose -f infra/docker-compose.yml up -d --wait
#
# Perfiles:
#   core           postgres + ollama + ingest. Siempre activo (sin clave `profiles:`); `--profile core` es no-op.
#   llmops         langfuse (LAB-64): web, worker y sus almacenes (postgres, clickhouse, redis, minio) con prefijo
#                  `langfuse-`. Interfaz en http://localhost:3001. Activar: --profile llmops.
#   observability  prometheus + grafana (LAB-102): Prometheus recoge el backend que corre en el host (puerto 8080)
#                  y Grafana arranca con el origen de datos y los dashboards de infra/observability/.
#                  Activar: --profile observability.
#   kafka          reservado, sin servicios todavia (F4).
# Activar un perfil reservado no produce error: `--profile <nombre>`.
# GPU NVIDIA opcional: anadir `-f infra/docker-compose.gpu.yml`.

name: shoplab

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoplab}
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
          psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc
          "select 1 from pg_extension where extname='vector'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.14}
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list | grep -qF "$${OLLAMA_CHAT_MODEL}" &&
          ollama list | grep -qF "$${OLLAMA_EMBED_MODEL}"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  # Parseo y troceado de documentos (LAB-20). Sin estado y sin acceso a la base de datos: entrega los chunks al modulo
  # retrieval del backend, que es quien los guarda.
  ingest:
    build:
      context: ../ingest
    image: ${INGEST_IMAGE:-shoplab-ingest:local}
    environment:
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE:-1000}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP:-100}
      INGEST_MAX_DOCUMENT_BYTES: ${INGEST_MAX_DOCUMENT_BYTES:-10485760}
    ports:
      - "${INGEST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.1}
    profiles: [observability]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # El backend corre en el host: host.docker.internal tambien debe resolver en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.3.0}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---- Perfil llmops (LAB-64): Langfuse v4 autoalojado --------------------------------------------------------------
  # Interfaz en http://localhost:${LANGFUSE_PORT:-3001} (3000 es de Grafana). Los almacenes no publican puertos al host
  # (solo MinIO, en loopback, para la carga de medios desde el navegador). Credenciales: marcadores SOLO para uso local.
  langfuse-postgres:
    image: ${LANGFUSE_POSTGRES_IMAGE:-docker.io/postgres:17.7}
    profiles: [llmops]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE:-docker.io/clickhouse/clickhouse-server:26.10.3.7}
    profiles: [llmops]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-change-me-local-only}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  langfuse-redis:
    image: ${LANGFUSE_REDIS_IMAGE:-docker.io/redis:7.4.6}
    profiles: [llmops]
    command: >
      --requirepass ${LANGFUSE_REDIS_AUTH:-change-me-local-only}
      --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_AUTH:-change-me-local-only}
    restart: unless-stopped

  langfuse-minio:
    image: ${LANGFUSE_MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:fb893e36fc369d41e92f678b17ec27378fa5bf0576aeef7ac15460c13629ab5a}
    profiles: [llmops]
    # El bucket `langfuse` es el directorio /data/langfuse: se crea antes de arrancar el servidor.
    entrypoint: sh
    command:
      - -c
      - mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_PORT:-9092}:9000"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE:-docker.langfuse.com/langfuse/langfuse-worker:4.77.0}
    profiles: [llmops]
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-change-me-local-only}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-change-me-local-only}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-change-me-local-only}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_AUTH:-change-me-local-only}
      REDIS_TLS_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-change-me-local-only}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-change-me-local-only}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on: &langfuse-depends
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    healthcheck:
      # Langfuse escucha en la direccion del contenedor, no en 127.0.0.1.
      test: ["CMD-SHELL", "wget -q --spider http://$${HOSTNAME}:3030/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  langfuse-web:
    image: ${LANGFUSE_WEB_IMAGE:-docker.langfuse.com/langfuse/langfuse:4.77.0}
    profiles: [llmops]
    depends_on: *langfuse-depends
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-local-only}
      # El navegador sube los medios a MinIO por el puerto publicado en el host.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LANGFUSE_MINIO_PORT:-9092}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
      # Organizacion, proyecto, usuario y claves creados al arrancar (sin alta manual en la interfaz).
      LANGFUSE_INIT_ORG_ID: shoplab
      LANGFUSE_INIT_ORG_NAME: ShopLab
      LANGFUSE_INIT_PROJECT_ID: shoplab-helpdesk
      LANGFUSE_INIT_PROJECT_NAME: shoplab-helpdesk
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PUBLIC_KEY:-pk-lf-shoplab-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_SECRET_KEY:-sk-lf-shoplab-local}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@shoplab.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-change-me-local-only}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$${HOSTNAME}:3000/api/public/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
  prometheus_data:
  grafana_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
