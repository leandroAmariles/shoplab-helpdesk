# Infraestructura local de ShopLab Helpdesk.
#
# Uso: docker compose -f infra/docker-compose.yml up -d --wait
#
# Perfiles:
#   core           postgres + ollama + ingest. Siempre activo (sin clave `profiles:`); `--profile core` es no-op.
#   llmops         reservado, sin servicios todavia (llega en una fase posterior).
#   observability  prometheus + grafana (LAB-102): Prometheus recoge el backend que corre en el host (puerto 8080)
#                  y Grafana arranca con el origen de datos y los dashboards de infra/observability/.
#                  Activar: --profile observability.
#   kafka          reservado, sin servicios todavia (F4).
# Activar un perfil reservado no produce error: `--profile <nombre>`.
# GPU NVIDIA opcional: anadir `-f infra/docker-compose.gpu.yml`.

name: shoplab

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoplab}
      POSTGRES_USER: ${POSTGRES_USER:-shoplab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} &&
          psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc
          "select 1 from pg_extension where extname='vector'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.12}
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ollama list | grep -qF "$${OLLAMA_CHAT_MODEL}" &&
          ollama list | grep -qF "$${OLLAMA_EMBED_MODEL}"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 600s
    restart: unless-stopped

  # Parseo y troceado de documentos (LAB-20). Sin estado y sin acceso a la base de datos: entrega los chunks al modulo
  # retrieval del backend, que es quien los guarda.
  ingest:
    build:
      context: ../ingest
    image: ${INGEST_IMAGE:-shoplab-ingest:local}
    environment:
      INGEST_CHUNK_SIZE: ${INGEST_CHUNK_SIZE:-1000}
      INGEST_CHUNK_OVERLAP: ${INGEST_CHUNK_OVERLAP:-100}
      INGEST_MAX_DOCUMENT_BYTES: ${INGEST_MAX_DOCUMENT_BYTES:-10485760}
    ports:
      - "${INGEST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0}
    profiles: [observability]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # El backend corre en el host: host.docker.internal tambien debe resolver en Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.4}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  ollama_models:
  prometheus_data:
  grafana_data:
