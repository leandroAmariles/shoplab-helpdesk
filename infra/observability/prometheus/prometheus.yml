# Prometheus local (perfil `observability` de docker compose, LAB-102).
# Los servicios se recogen en los puertos que publica en el host el compose (host.docker.internal). Prometheus no
# expande variables de entorno en este archivo: los puertos del host son fijos (gateway 8080, retrieval 8082,
# chat 8083, eval 8084).
global:
  scrape_interval: 15s

scrape_configs:
  # Puerta de la API (LAB-107): peticiones por ruta en spring_cloud_gateway_requests_seconds.
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # La base de conocimiento en su propio servicio (LAB-129): puerto 8082 del host.
  - job_name: retrieval-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  # El orquestador conversacional en su propio servicio (LAB-59): puerto 8083 del host.
  - job_name: chat-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  # El historial de ejecuciones de evaluacion en su propio servicio (LAB-130): puerto 8084 del host.
  - job_name: eval-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]

  # El servicio ingest corre en compose (LAB-20): se llega por el nombre del servicio en la red del proyecto.
  - job_name: ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["ingest:8000"]
