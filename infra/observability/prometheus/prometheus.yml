# Prometheus local (perfil `observability` de docker compose, LAB-102).
# El backend corre en el host durante el desarrollo (compose solo tiene Postgres y Ollama), por eso se recoge en
# host.docker.internal. Prometheus no expande variables de entorno en este archivo: los puertos del host son fijos
# (backend 8081, gateway 8080; LAB-107). Un backend en el IDE arranca con SERVER_PORT=8081.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: helpdesk-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  # Puerta de la API (LAB-107): peticiones por ruta en spring_cloud_gateway_requests_seconds.
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  # El servicio ingest corre en compose (LAB-20): se llega por el nombre del servicio en la red del proyecto.
  - job_name: ingest
    metrics_path: /metrics
    static_configs:
      - targets: ["ingest:8000"]
