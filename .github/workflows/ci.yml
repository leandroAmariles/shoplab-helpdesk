name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ingest: ${{ steps.filter.outputs.ingest }}
      eval: ${{ steps.filter.outputs.eval }}
      notebooks: ${{ steps.filter.outputs.notebooks }}
      ml: ${{ steps.filter.outputs.ml }}
      olist: ${{ steps.filter.outputs.olist }}
      kb: ${{ steps.filter.outputs.kb }}
      observability: ${{ steps.filter.outputs.observability }}
      litellm: ${{ steps.filter.outputs.litellm }}
      ci: ${{ steps.filter.outputs.ci }}
      python_matrix: ${{ steps.python.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docs/modulos/**'
              # The retrieval client is checked against the contract of the ingest service (specs/LAB-20).
              - 'ingest/openapi.json'
            frontend:
              - 'frontend/**'
            ingest:
              - 'ingest/**'
              # The corpus tests of ingest chunk every document of the knowledge base.
              - 'data/kb/**'
            eval:
              - 'eval/**'
              # The dataset validation checks every expected document against the corpus.
              - 'data/kb/**'
            notebooks:
              - 'notebooks/**'
              # The chunking notebook reuses the chunker of ingest and validates its questions against the corpus.
              - 'ingest/app/**'
              - 'data/kb/**'
            ml:
              - 'ml/**'
              # The analysis contrasts the data with the policy corpus.
              - 'data/kb/**'
              # The notebook job loads the fixtures of the Olist loader and applies the real migrations of the
              # orders and catalog schemas, so it follows them.
              - 'data/olist/**'
              - 'backend/src/main/resources/db/migration/orders/**'
              - 'backend/src/main/resources/db/migration/catalog/**'
            olist:
              - 'data/olist/**'
              # The loader tests apply the migrations of orders and catalog, so they follow those scripts.
              - 'backend/src/main/resources/db/migration/orders/**'
              - 'backend/src/main/resources/db/migration/catalog/**'
            kb:
              - 'data/kb-tools/**'
              - 'data/kb/**'
            observability:
              - 'infra/observability/**'
              - 'infra/docker-compose.yml'
            # Gateway de modelos (LAB-84): su configuracion, scripts y el compose que los monta.
            litellm:
              - 'infra/litellm/**'
              - 'infra/docker-compose*.yml'
              - 'infra/.env.example'
            ci:
              - '.github/workflows/ci.yml'
      # The matrix context is not available in a job-level `if`, so the Python
      # components to run are selected here and consumed with fromJSON.
      - name: Select Python components
        id: python
        env:
          INGEST: ${{ steps.filter.outputs.ingest }}
          EVAL: ${{ steps.filter.outputs.eval }}
          NOTEBOOKS: ${{ steps.filter.outputs.notebooks }}
          ML: ${{ steps.filter.outputs.ml }}
          OLIST: ${{ steps.filter.outputs.olist }}
          KB: ${{ steps.filter.outputs.kb }}
          LITELLM: ${{ steps.filter.outputs.litellm }}
          CI_CHANGED: ${{ steps.filter.outputs.ci }}
        run: |
          items=()
          if [ "$INGEST" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"ingest"'); fi
          if [ "$EVAL" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"eval"'); fi
          if [ "$NOTEBOOKS" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"notebooks"'); fi
          if [ "$ML" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"ml"'); fi
          if [ "$OLIST" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"data/olist"'); fi
          if [ "$KB" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"data/kb-tools"'); fi
          if [ "$LITELLM" = "true" ] || [ "$CI_CHANGED" = "true" ]; then items+=('"infra/litellm"'); fi
          echo "matrix=[$(IFS=,; echo "${items[*]}")]" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
          server-id: github-shoplab-contracts
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify (Checkstyle, PMD, Modulith, tests, JaCoCo gate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp clean verify
      - name: Module documentation is up to date
        # ModularityTests regenerates docs/modulos from the code (LAB-105); a diff means it was not committed.
        run: |
          if [ -n "$(git status --porcelain -- ../docs/modulos)" ]; then
            git status --short -- ../docs/modulos
            echo "::error::docs/modulos is out of date: run './mvnw test -Dtest=ModularityTests' in backend/ and commit the result"
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  qodana:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      checks: write
    env:
      # Fork PRs get a read-only token: skip comments, annotations and SARIF upload there.
      CAN_WRITE: ${{ github.event.pull_request.head.repo.fork != true }}
    steps:
      - uses: actions/checkout@v7
      - name: Qodana scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: --project-dir,backend,--baseline,qodana.sarif.json
          pr-mode: false
          use-caches: true
          upload-result: true
          artifact-name: qodana-report
          use-annotations: ${{ env.CAN_WRITE }}
          post-pr-comment: ${{ env.CAN_WRITE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF to code scanning
        if: always() && env.CAN_WRITE == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    env:
      # Fork and Dependabot PRs get a read-only token: skip the SARIF upload there.
      CAN_WRITE: ${{ github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
      # Report pass: never fails, so a tool/DB error here is distinguishable from the gate below.
      - name: Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,target,.venv
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          exit-code: '0'
      - name: Upload SARIF to code scanning
        if: always() && env.CAN_WRITE == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14
      # Gate pass: prints package, installed and fixed versions in the log and fails on findings.
      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,target,.venv
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Detect Angular project
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::frontend/package.json not found; skipping Angular checks"
          fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@leandroamariles'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Test
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  python:
    needs: changes
    if: needs.changes.outputs.python_matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.python_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect Python project
        id: detect
        run: |
          if [ -f "${{ matrix.component }}/pyproject.toml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ matrix.component }}/pyproject.toml not found; skipping Python checks"
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.detect.outputs.exists == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.component }}/uv.lock
      - name: Install
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: uv sync --frozen
      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: uv run ruff check .
      - name: Test
        if: steps.detect.outputs.exists == 'true'
        working-directory: ${{ matrix.component }}
        run: uv run pytest

  # LAB-116: executes the exploratory notebook of ml/ against a real Postgres. The full Olist dataset is CC BY-NC-SA and is
  # never downloaded in CI, so the database holds only the loader fixtures: this proves that the notebook runs with few
  # rows and fails the pull request on any error, not that the conclusions saved in the repository still hold.
  ml-notebook:
    needs: changes
    if: needs.changes.outputs.ml == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16 # the image of infra/docker-compose.yml
        env:
          POSTGRES_DB: shoplab
          POSTGRES_USER: shoplab
          POSTGRES_PASSWORD: change-me-local-only # local-only value of the compose file, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoplab -d shoplab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: shoplab
      PGPASSWORD: change-me-local-only
      PGDATABASE: shoplab
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            ml/uv.lock
            data/olist/uv.lock
      - name: Install the analysis
        working-directory: ml
        run: uv sync --frozen
      - name: Install the Olist loader
        working-directory: data/olist
        run: uv sync --frozen
      - name: Prepare the database (migrations of orders and catalog, and the loader fixtures)
        run: ml/ci/prepare-database.sh
      # --output-dir keeps the executed copy out of the working tree: the notebook saved in the repository comes from a
      # local run with the full dataset and must not be replaced by a run over a handful of rows.
      - name: Execute the notebook
        working-directory: ml
        env:
          POSTGRES_URL: postgresql://localhost:5432/shoplab
          POSTGRES_USER: shoplab
          POSTGRES_PASSWORD: change-me-local-only
          EDA_MIN_GROUP_ORDERS: "1"
        run: uv run jupyter nbconvert --to notebook --execute --output-dir "$RUNNER_TEMP" notebooks/olist-eda.ipynb

  observability:
    needs: changes
    if: >-
      needs.changes.outputs.observability == 'true' || needs.changes.outputs.litellm == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Grafana dashboards
        run: bash infra/observability/check-dashboards.sh
      - name: Validate the core compose services (model gateway)
        run: docker compose -f infra/docker-compose.yml config -q
      - name: Validate the Ollama host override
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.ollama-host.yml config -q
      - name: Validate the compose profile
        run: docker compose -f infra/docker-compose.yml --profile observability config -q
      - name: Validate the llmops compose profile
        run: docker compose -f infra/docker-compose.yml --profile llmops config -q
      # Every dashboard JSON must be packaged as a labelled ConfigMap for the cluster (Argo CD reads this path).
      - name: Validate the dashboards kustomization
        run: |
          rendered="$(kubectl kustomize infra/observability)"
          expected="$(ls infra/observability/dashboards/*.json | wc -l)"
          configmaps="$(echo "$rendered" | grep -c '^kind: ConfigMap')"
          labelled="$(echo "$rendered" | grep -c 'grafana_dashboard: "1"')"
          if [ "$configmaps" -ne "$expected" ] || [ "$labelled" -ne "$expected" ]; then
            echo "Expected $expected labelled ConfigMaps, got $configmaps ConfigMaps and $labelled labels" >&2
            exit 1
          fi

  ci-gate:
    needs: [changes, backend, qodana, trivy, frontend, python, ml-notebook, observability]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any component failed or was cancelled
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not succeed" >&2
            exit 1
          fi
