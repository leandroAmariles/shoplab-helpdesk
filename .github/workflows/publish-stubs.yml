name: Publish Contract Stubs

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'backend/src/test/resources/contracts/**'
      - 'backend/pom.xml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-stubs:
    name: Verify Contracts & Publish Stubs to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Verify contracts and package stubs JAR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp clean verify
      - name: Deploy stubs artifact to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -ntp deploy -DskipTests -Dcheckstyle.skip=true -Dpmd.skip=true -Djacoco.skip=true
