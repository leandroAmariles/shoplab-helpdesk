version: 2

registries:
  github-maven:
    type: maven-repository
    url: https://maven.pkg.github.com/leandroAmariles
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: maven
    directory: /backend
    registries:
      - github-maven
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    registries:
      - github-npm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # @angular/* packages pin each other with exact peer dependencies; separate PRs fail `npm ci` with ERESOLVE.
    groups:
      angular:
        patterns:
          - "@angular/*"

  # pip reads pyproject.toml but does not update uv.lock; Trivy still scans uv.lock.
  - package-ecosystem: pip
    directory: /ingest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /eval
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # LAB-78 fixes docker/login-action@v3 and docker/build-push-action@v6; majors need a story update.
    ignore:
      - dependency-name: "docker/login-action"
        update-types: ["version-update:semver-major"]
      - dependency-name: "docker/build-push-action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Java major bumps (21 -> 25) follow java.version in backend/pom.xml, not Dependabot.
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Node major bumps (22 -> 25) follow the version used in ci.yml, not Dependabot.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /ingest
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # The Python version follows requires-python in ingest/pyproject.toml, not Dependabot.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Current images (pgvector, ollama) live in the compose files.
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # A major PostgreSQL upgrade needs its data volume migrated, and 18 also moves the data directory: with 18.6 the
    # services did not start (LAB-129).
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
